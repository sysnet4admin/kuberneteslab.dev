name: 발표 링크 감지

# data/talks.yaml에서 YouTube 영상이나 sched 세션 링크가 빠진 발표의 후보를 찾아 이슈로 알린다.
# 알림만 하고 파일은 고치지 않는다. 같은 링크로 연 이슈가 있으면(닫힌 것 포함) 다시 열지 않는다.
on:
  schedule:
    - cron: '20 1 * * *'   # 한국 시간 매일 10:20
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 후보 찾기
        run: |
          pip install --quiet pyyaml
          python3 scripts/talk_link_watch.py > found.json

      - name: 이슈 열기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create talk-links --color 0E8A16 --description "Archives 발표 링크 후보" --force >/dev/null
          python3 - <<'PY' > issues.tsv
          import json
          for r in json.load(open("found.json")):
              print("\t".join([r["kind"], r["talk"], r["url"], r["detail"]]))
          PY
          while IFS=$'\t' read -r kind talk url detail; do
            [ -z "$url" ] && continue
            if [ -n "$(gh issue list --state all --label talk-links --search "\"$url\" in:body" --json number -q '.[].number')" ]; then
              echo "이미 있음: $url"; continue
            fi
            body=$(printf 'data/talks.yaml에 없는 %s 링크 후보를 찾았습니다.\n\n- 발표: %s\n- 후보: %s\n- 출처: %s\n\n맞으면 data/talks.yaml의 해당 발표 links에 넣고 이 이슈를 닫아 주세요. 다른 발표라면 그냥 닫으면 됩니다.\n' "$kind" "$talk" "$url" "$detail")
            gh issue create --title "[발표 링크 감지] $kind: ${talk:0:60}" --label talk-links --body "$body"
          done < issues.tsv
