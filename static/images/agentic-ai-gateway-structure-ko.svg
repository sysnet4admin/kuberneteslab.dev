<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="380" fill="white"/>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
</defs>

<text x="450" y="30" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">게이트웨이가 없을 때와 있을 때의 MCP 서버 연결 구조</text>

<!-- 왼쪽: 게이트웨이 없음 -->
<text x="222" y="70" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">게이트웨이가 없을 때</text>

<rect x="30" y="110" width="110" height="44" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="85" y="137" font-size="11.5" fill="#222" text-anchor="middle" font-weight="bold">에이전트 1</text>
<rect x="30" y="220" width="110" height="44" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="85" y="247" font-size="11.5" fill="#222" text-anchor="middle" font-weight="bold">에이전트 2</text>

<rect x="300" y="96" width="120" height="40" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
<text x="360" y="115" font-size="10.5" fill="#444" text-anchor="middle">팀 A의 MCP 서버</text>
<text x="360" y="129" font-size="9" fill="#C0392B" text-anchor="middle">권한 설정, 기록</text>
<rect x="300" y="167" width="120" height="40" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
<text x="360" y="186" font-size="10.5" fill="#444" text-anchor="middle">팀 B의 MCP 서버</text>
<text x="360" y="200" font-size="9" fill="#C0392B" text-anchor="middle">권한 설정, 기록</text>
<rect x="300" y="238" width="120" height="40" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
<text x="360" y="257" font-size="10.5" fill="#444" text-anchor="middle">팀 C의 MCP 서버</text>
<text x="360" y="271" font-size="9" fill="#C0392B" text-anchor="middle">권한 설정, 기록</text>

<g stroke="#555" stroke-width="1.4" marker-end="url(#a)">
<line x1="142" y1="126" x2="296" y2="116"/>
<line x1="142" y1="132" x2="296" y2="185"/>
<line x1="142" y1="138" x2="296" y2="252"/>
<line x1="142" y1="236" x2="296" y2="124"/>
<line x1="142" y1="242" x2="296" y2="192"/>
<line x1="142" y1="248" x2="296" y2="258"/>
</g>

<text x="222" y="318" font-size="10.5" fill="#555" text-anchor="middle">에이전트마다 서버 주소 3개를 설정</text>
<text x="222" y="336" font-size="10.5" fill="#555" text-anchor="middle">누가 어떤 도구를 호출할 수 있는지는 서버마다 따로 관리</text>

<line x1="450" y1="64" x2="450" y2="350" stroke="#ddd" stroke-width="1.2"/>

<!-- 오른쪽: 게이트웨이 있음 -->
<text x="678" y="70" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">게이트웨이가 있을 때</text>

<rect x="470" y="110" width="96" height="44" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="518" y="137" font-size="11.5" fill="#222" text-anchor="middle" font-weight="bold">에이전트 1</text>
<rect x="470" y="220" width="96" height="44" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="518" y="247" font-size="11.5" fill="#222" text-anchor="middle" font-weight="bold">에이전트 2</text>

<rect x="600" y="122" width="124" height="130" rx="7" fill="#ffffff" stroke="#326CE5" stroke-width="2.2"/>
<text x="662" y="160" font-size="12" fill="#326CE5" text-anchor="middle" font-weight="bold">MCP 게이트웨이</text>
<text x="662" y="190" font-size="10" fill="#444" text-anchor="middle">도구 호출 권한 통제</text>
<text x="662" y="208" font-size="10" fill="#444" text-anchor="middle">호출 기록</text>
<text x="662" y="226" font-size="10" fill="#444" text-anchor="middle">서버 3개를 1개로 제공</text>

<rect x="760" y="96" width="120" height="40" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
<text x="820" y="121" font-size="10.5" fill="#444" text-anchor="middle">팀 A의 MCP 서버</text>
<rect x="760" y="167" width="120" height="40" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
<text x="820" y="192" font-size="10.5" fill="#444" text-anchor="middle">팀 B의 MCP 서버</text>
<rect x="760" y="238" width="120" height="40" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
<text x="820" y="263" font-size="10.5" fill="#444" text-anchor="middle">팀 C의 MCP 서버</text>

<g stroke="#555" stroke-width="1.4" marker-end="url(#a)">
<line x1="568" y1="132" x2="596" y2="160"/>
<line x1="568" y1="242" x2="596" y2="214"/>
<line x1="726" y1="160" x2="756" y2="118"/>
<line x1="726" y1="187" x2="756" y2="187"/>
<line x1="726" y1="214" x2="756" y2="256"/>
</g>

<text x="678" y="318" font-size="10.5" fill="#555" text-anchor="middle">에이전트는 게이트웨이 주소 1개만 설정</text>
<text x="678" y="336" font-size="10.5" fill="#555" text-anchor="middle">통제와 이에 따른 기록을 한곳에서 관리</text>
</svg>
