baseURL = 'https://kuberneteslab.dev/'
title = 'KubernetesLab'
theme = 'PaperMod'
paginate = 10
defaultContentLanguage = 'ko'
defaultContentLanguageInSubdir = true

[params]
  env = "production"
  mainSections = ["blog"]
  description = "Kubernetes & Cloud Native Research Lab"
  author = "Hoon Jo"
  images = ["/images/og-brand.png"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  UseHugoToc = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/sysnet4admin"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/hoonjo/"
  [[params.socialIcons]]
    name = "youtube"
    url = "https://www.youtube.com/HoonJo"

[params.assets]
  favicon = "favicon.svg"

[params.label]
  text = "KubernetesLab"
  iconSVG = """<svg width="36" height="36" viewBox="-19.5 -19.5 39 39" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0; overflow:visible;">
  <circle cx="0" cy="0" r="18" fill="#2F6FE8" stroke="white" stroke-width="1.5"/>
  <g stroke="white" stroke-linecap="round" stroke-width="2.3" opacity="0.97">
    <line x1="1.5"  y1="-3.2" x2="5.8"  y2="-7.5"/>
    <line x1="2.7"  y1="-1.1" x2="8.2"  y2="-2.8"/>
    <line x1="2.7"  y1="1.1"  x2="8.2"  y2="2.8"/>
    <line x1="1.5"  y1="3.2"  x2="5.8"  y2="7.5"/>
    <line x1="-1.5" y1="3.2"  x2="-5.8" y2="7.5"/>
    <line x1="-2.7" y1="1.1"  x2="-8.2" y2="2.8"/>
    <line x1="-2.7" y1="-1.1" x2="-8.2" y2="-2.8"/>
    <line x1="-1.5" y1="-3.2" x2="-5.8" y2="-7.5"/>
    <line x1="0"    y1="-4.2" x2="0"    y2="-7.2"/>
    <line x1="0"    y1="4.2"  x2="0"    y2="7.2"/>
  </g>
  <circle cx="0" cy="0" r="4.6" fill="white"/>
  <circle cx="0" cy="0" r="3.3" fill="#2F6FE8"/>
  <circle cx="0" cy="0" r="2.0" fill="white"/>
</svg>"""

[languages]
  [languages.ko]
    languageName = "한국어"
    languageCode = "ko"
    contentDir = "content/ko"
    weight = 1
    [languages.ko.params]
      homeInfoParams.Title = "KubernetesLab"
      homeInfoParams.Content = "Kubernetes & Cloud Native & AI 연구, 컨설팅, 교육  \nCNCF Ambassador / Kubestronaut / AIOps Researcher"
    [[languages.ko.menu.main]]
      identifier = "blog"
      name = "Blog"
      url = "/ko/blog/"
      weight = 10
    [[languages.ko.menu.main]]
      identifier = "categories"
      name = "Categories"
      url = "/ko/categories/"
      weight = 20
    [[languages.ko.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/ko/tags/"
      weight = 30
    [[languages.ko.menu.main]]
      identifier = "about"
      name = "About"
      url = "/ko/about/"
      weight = 40
    [[languages.ko.menu.main]]
      identifier = "archive"
      name = "Archives"
      url = "/ko/archives/"
      weight = 50

  [languages.en]
    languageName = "English"
    languageCode = "en"
    contentDir = "content/en"
    weight = 2
    [languages.en.params]
      homeInfoParams.Title = "KubernetesLab"
      homeInfoParams.Content = "Kubernetes, Cloud Native & AI Research, Consulting, and Training  \nCNCF Ambassador / Kubestronaut / AIOps Researcher"
    [[languages.en.menu.main]]
      identifier = "blog"
      name = "Blog"
      url = "/en/blog/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "categories"
      name = "Categories"
      url = "/en/categories/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/en/tags/"
      weight = 30
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      url = "/en/about/"
      weight = 40
    [[languages.en.menu.main]]
      identifier = "archive"
      name = "Archives"
      url = "/en/archives/"
      weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
