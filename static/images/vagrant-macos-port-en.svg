<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#326CE5"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8ca5"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker></defs>
<rect width="1200" height="620" fill="white"/>
<text x="600.0" y="34.0" font-size="18" fill="#111" text-anchor="middle" font-weight="bold">How Vagrant checks whether a port is free</text>
<text x="600.0" y="58.0" font-size="13" fill="#444" text-anchor="middle" font-weight="normal">The same check gives the opposite result because the value the macOS kernel returns has changed</text>
<rect x="30.0" y="80.0" width="555.0" height="500.0" rx="12" fill="#f6f8fb" stroke="#dde3ee" stroke-width="1.2"/>
<text x="50.0" y="108.0" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Earlier macOS</text>
<text x="50.0" y="126.0" font-size="12" fill="#7b8ca5" text-anchor="start" font-weight="normal">The refusal comes back as an error</text>
<rect x="50.0" y="142.0" width="140.0" height="44.0" rx="8" fill="#fff" stroke="#444" stroke-width="1.2"/>
<text x="120.0" y="162.0" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">Vagrant</text>
<text x="120.0" y="178.0" font-size="11" fill="#7b8ca5" text-anchor="middle" font-weight="normal" font-family="Menlo, monospace">is_port_open?</text>
<line x1="120.0" y1="186.0" x2="120.0" y2="540.0" stroke="#dde3ee" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect x="240.0" y="142.0" width="140.0" height="44.0" rx="8" fill="#fff" stroke="#444" stroke-width="1.2"/>
<text x="310.0" y="162.0" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">Ruby</text>
<text x="310.0" y="178.0" font-size="11" fill="#7b8ca5" text-anchor="middle" font-weight="normal" font-family="Menlo, monospace">Socket.tcp</text>
<line x1="310.0" y1="186.0" x2="310.0" y2="540.0" stroke="#dde3ee" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect x="425.0" y="142.0" width="140.0" height="44.0" rx="8" fill="#fff" stroke="#444" stroke-width="1.2"/>
<text x="495.0" y="162.0" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">macOS kernel</text>
<line x1="495.0" y1="186.0" x2="495.0" y2="540.0" stroke="#dde3ee" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="124.0" y1="222.0" x2="304.0" y2="222.0" stroke="#444" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<text x="215.0" y="214.0" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">Try to connect to the host port</text>
<line x1="314.0" y1="268.0" x2="489.0" y2="268.0" stroke="#444" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<text x="402.5" y="260.0" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">connect (start)</text>
<path d="M312,306 h40 v20 h-34" stroke="#7b8ca5" stroke-width="1.3" fill="none" marker-end="url(#arr-muted)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="360.0" y="320.0" font-size="12" fill="#7b8ca5" text-anchor="start" font-weight="normal">Wait until the timeout</text>
<line x1="314.0" y1="360.0" x2="489.0" y2="360.0" stroke="#444" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<text x="402.5" y="352.0" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">Call connect again</text>
<line x1="491.0" y1="406.0" x2="316.0" y2="406.0" stroke="#444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<text x="402.5" y="398.0" font-size="12.5" fill="#444" text-anchor="middle" font-weight="bold">ECONNREFUSED (refused)</text>
<line x1="306.0" y1="470.0" x2="126.0" y2="470.0" stroke="#444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<text x="215.0" y="462.0" font-size="12.5" fill="#444" text-anchor="middle" font-weight="bold">Error (connection refused)</text>
<rect x="50.0" y="500.0" width="515.0" height="58.0" rx="8" fill="#eef6f1" stroke="#2e7d4f" stroke-width="1.2"/>
<text x="66.0" y="524.0" font-size="13" fill="#2e7d4f" text-anchor="start" font-weight="bold">The port is free, so forwarding goes ahead</text>
<text x="66.0" y="544.0" font-size="11.5" fill="#2e7d4f" text-anchor="start" font-weight="normal">vagrant up continues</text>
<rect x="615.0" y="80.0" width="555.0" height="500.0" rx="12" fill="#f6f8fb" stroke="#dde3ee" stroke-width="1.2"/>
<text x="635.0" y="108.0" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold">macOS 26.7 and later</text>
<text x="635.0" y="126.0" font-size="12" fill="#7b8ca5" text-anchor="start" font-weight="normal">First reported on the macOS 27 beta</text>
<rect x="635.0" y="142.0" width="140.0" height="44.0" rx="8" fill="#fff" stroke="#444" stroke-width="1.2"/>
<text x="705.0" y="162.0" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">Vagrant</text>
<text x="705.0" y="178.0" font-size="11" fill="#7b8ca5" text-anchor="middle" font-weight="normal" font-family="Menlo, monospace">is_port_open?</text>
<line x1="705.0" y1="186.0" x2="705.0" y2="540.0" stroke="#dde3ee" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect x="825.0" y="142.0" width="140.0" height="44.0" rx="8" fill="#fff" stroke="#444" stroke-width="1.2"/>
<text x="895.0" y="162.0" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">Ruby</text>
<text x="895.0" y="178.0" font-size="11" fill="#7b8ca5" text-anchor="middle" font-weight="normal" font-family="Menlo, monospace">Socket.tcp</text>
<line x1="895.0" y1="186.0" x2="895.0" y2="540.0" stroke="#dde3ee" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect x="1010.0" y="142.0" width="140.0" height="44.0" rx="8" fill="#fff" stroke="#c0392b" stroke-width="1.2"/>
<text x="1080.0" y="162.0" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">macOS kernel</text>
<line x1="1080.0" y1="186.0" x2="1080.0" y2="540.0" stroke="#dde3ee" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="709.0" y1="222.0" x2="889.0" y2="222.0" stroke="#444" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<text x="800.0" y="214.0" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">Try to connect to the host port</text>
<line x1="899.0" y1="268.0" x2="1074.0" y2="268.0" stroke="#444" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<text x="987.5" y="260.0" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">connect (start)</text>
<path d="M897,306 h40 v20 h-34" stroke="#7b8ca5" stroke-width="1.3" fill="none" marker-end="url(#arr-muted)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="945.0" y="320.0" font-size="12" fill="#7b8ca5" text-anchor="start" font-weight="normal">Wait until the timeout</text>
<line x1="899.0" y1="360.0" x2="1074.0" y2="360.0" stroke="#444" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<text x="987.5" y="352.0" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">Call connect again</text>
<line x1="1076.0" y1="406.0" x2="901.0" y2="406.0" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-red)"/>
<text x="987.5" y="398.0" font-size="12.5" fill="#c0392b" text-anchor="middle" font-weight="bold">EISCONN (already connected)</text>
<rect x="995.0" y="418.0" width="170.0" height="40.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
<text x="1080.0" y="434.0" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="normal">The real result, the refusal,</text>
<text x="1080.0" y="449.0" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="normal">stays in SO_ERROR</text>
<line x1="891.0" y1="470.0" x2="711.0" y2="470.0" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-red)"/>
<text x="800.0" y="462.0" font-size="12.5" fill="#c0392b" text-anchor="middle" font-weight="bold">Treated as success</text>
<rect x="635.0" y="500.0" width="515.0" height="58.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="651.0" y="524.0" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">The port looks in use, so vagrant up fails</text>
<text x="651.0" y="544.0" font-size="11.5" fill="#c0392b" text-anchor="start" font-weight="normal" font-family="Menlo, monospace">Vagrant cannot forward the specified ports on this VM</text>
<text x="600.0" y="606.0" font-size="11.5" fill="#7b8ca5" text-anchor="middle" font-weight="normal">Ruby 3.4.11 and later read SO_ERROR first after waiting, but the Ruby bundled with Vagrant 2.4.9 is 3.3.8</text>
</svg>
