<rect x="560" y="344" width="320" height="44" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
<text x="720" y="371" font-size="11" fill="#333" text-anchor="middle">6 hosted projects, 270 members</text>

<text x="880" y="430" font-size="10" fill="#888" text-anchor="end">* Not an official diagram of either foundation. I drew it to compare the two, and the row mapping is my reading</text>
