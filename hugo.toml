baseURL = 'https://kuberneteslab.dev/'
title = 'KubernetesLab'
theme = 'PaperMod'
defaultContentLanguage = 'ko'
defaultContentLanguageInSubdir = true
# 계속 고치는 페이지(Archives)에 실제 수정일을 보여 주려고 Git 기록을 읽는다
enableGitInfo = true
enableRobotsTXT = true

[params]
  env = "production"
  mainSections = ["blog"]
  description = "Kubernetes & Cloud Native Research Lab"
  author = "Hoon Jo"
  images = ["/images/og-brand.png"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  UseHugoToc = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/sysnet4admin"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/hoonjo/"
  [[params.socialIcons]]
    name = "youtube"
    url = "https://www.youtube.com/@kuberneteslab"

# 뉴스레터 구독(Kit). 우리 HTML 폼이 Kit 폼 주소로 이메일만 보낸다. 폼이 바뀌면 여기 두 번호만 고친다.
[params.newsletter]
  action = "https://app.kit.com/forms/%s/subscriptions"
