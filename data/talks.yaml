# Archives의 발표 목록. content/{ko,en}/archives/_index.md의 talks 쇼트코드가 읽는다.
# date가 있는 항목은 그날이 모든 시간대에서 끝나면(UTC-12 기준, 매일 12:10 UTC 재배포) 발표 이력으로 내려간다.
# 예정된 발표는 날짜순, 발표 이력은 date가 있는 항목을 최신순으로 먼저 두고 year만 있는 항목은 이 파일 순서대로 둔다.
# 새 발표는 date를 넣어 맨 위에 추가한다.
# date_label은 화면에 보일 날짜(여러 날 행사)이고 없으면 date를 쓴다. year만 있는 항목은 이력에만 보인다.
# 값이 언어마다 다르면 {ko: ..., en: ...}로 쓴다.
# sched_site에 행사의 sched 주소를 적어 두면 세션 링크가 공개될 때 발표 링크 감지 워크플로가 이슈로 알린다.
