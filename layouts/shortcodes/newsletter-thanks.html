{{- /* 뉴스레터 구독 완료 페이지. Kit 폼의 "가입 후 이동 주소"가 이 페이지를 가리킨다.
     구독 폼의 확인 창(iframe) 안에서 열리면 바깥 페이지에 완료 신호를 보내 폼 자리를 완료 문구로 바꾸게 한다.
     새 탭으로 열리면 구독 버튼을 누른 페이지(nl_return 쿠키)로 돌아가는 링크를 보여 준다. */ -}}
{{- $ko := eq .Page.Language.Lang "ko" -}}
<p><a id="nl-back" href="{{ cond $ko "/ko/" "/en/" }}">{{ cond $ko "블로그로 돌아가기" "Back to the blog" }}</a></p>
<script>
(function () {
  if (window.top !== window.self) { window.parent.postMessage({ name: 'kl:newsletter:done' }, '*'); return; }
  var m = document.cookie.match(/(?:^|; )nl_return=([^;]+)/);
  if (!m) return;
  var url = decodeURIComponent(m[1]);
  if (!/^https:\/\/(promo\.)?kuberneteslab\.dev\//.test(url)) return;
  var a = document.getElementById('nl-back');
  a.href = url;
  a.textContent = {{ cond $ko "이전 페이지로 돌아가기" "Back to the previous page" }};
})();
</script>
