<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="470" fill="white"/>
<text x="450" y="30" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">Ecosystems of CNCF and the Agentic AI Foundation</text>


<text x="110" y="74" font-size="11.5" fill="#777" text-anchor="middle">Aspect</text>
<rect x="210" y="52" width="320" height="34" rx="6" fill="#EEF3FC" stroke="#326CE5" stroke-width="1.6"/>
<text x="370" y="74" font-size="13" fill="#326CE5" text-anchor="middle" font-weight="bold">CNCF</text>
<rect x="560" y="52" width="320" height="34" rx="6" fill="#F3EEFB" stroke="#7B4BC4" stroke-width="1.6"/>
<text x="720" y="74" font-size="13" fill="#7B4BC4" text-anchor="middle" font-weight="bold">Agentic AI Foundation (AAIF)</text>


<text x="110" y="122" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">Founded</text>
<rect x="210" y="100" width="320" height="38" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
<text x="370" y="124" font-size="11" fill="#333" text-anchor="middle">July 2015, with Kubernetes donated by Google</text>
<rect x="560" y="100" width="320" height="38" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
<text x="720" y="124" font-size="11" fill="#333" text-anchor="middle">December 2025, with MCP, goose and AGENTS.md</text>


<text x="110" y="182" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">Core projects</text>
<rect x="210" y="152" width="320" height="50" rx="5" fill="#ffffff" stroke="#326CE5" stroke-width="1.8"/>
<text x="370" y="174" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Kubernetes</text>
<text x="370" y="192" font-size="10" fill="#666" text-anchor="middle">Platform to deploy and run containers</text>
<rect x="560" y="152" width="320" height="50" rx="5" fill="#ffffff" stroke="#7B4BC4" stroke-width="1.8"/>
<text x="720" y="174" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">MCP, A2A</text>
<text x="720" y="192" font-size="10" fill="#666" text-anchor="middle">Protocols for tool access and agent-to-agent calls</text>


<text x="110" y="246" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">Traffic layer</text>
<rect x="210" y="216" width="320" height="50" rx="5" fill="#ffffff" stroke="#326CE5" stroke-width="1.8"/>
<text x="370" y="238" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Envoy, Gateway API</text>
<text x="370" y="256" font-size="10" fill="#666" text-anchor="middle">Envoy in CNCF since 2017, Gateway API GA in 2023</text>
<rect x="560" y="216" width="320" height="50" rx="5" fill="#ffffff" stroke="#7B4BC4" stroke-width="1.8"/>
<text x="720" y="238" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">agentgateway, Agent Router</text>
<text x="720" y="256" font-size="10" fill="#666" text-anchor="middle">Hosted projects since June and September 2026</text>


<text x="110" y="310" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">Other major projects</text>
<rect x="210" y="280" width="320" height="50" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
<text x="370" y="302" font-size="11" fill="#333" text-anchor="middle">Monitoring, packaging, security and more</text>
<text x="370" y="320" font-size="10" fill="#666" text-anchor="middle">Prometheus, Helm and others</text>
<rect x="560" y="280" width="320" height="50" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
<text x="720" y="302" font-size="11" fill="#333" text-anchor="middle">An agent and agent instructions</text>
<text x="720" y="320" font-size="10" fill="#666" text-anchor="middle">goose, AGENTS.md</text>


<text x="110" y="370" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">Size today</text>
<rect x="210" y="344" width="320" height="44" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
